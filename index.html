const WEEK_LABELS = { week1: 'Week 1', week2: 'Week 2' };

/* ---------------------------------------------------------
   PDF MENU IMPORT (best-effort auto-fill, always reviewable)
   ------------------------------------------------------------
   Mess menu PDFs are tables, and table text extracted from a
   PDF loses its column structure — this uses pattern-matching
   (recurring phrases like "Tea, Coffee, Milk" or "Roti, Rice"
   that typically start each day's cell) to guess where one
   day's text ends and the next begins. It's a best-effort guess,
   not a guarantee — the admin still reviews every day before
   saving, and nothing is written to the live site until they
   click Save.
--------------------------------------------------------- */
if(typeof pdfjsLib !== 'undefined'){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';
}
const DAYS_MON_FIRST = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

function extractMealRow(block, label, nextLabels){
  const m = block.match(new RegExp(label, 'i'));
  if(!m) return '';
  const start = m.index + m[0].length;
  let end = block.length;
  for(const nl of nextLabels){
    const idx = block.slice(start).search(new RegExp(nl, 'i'));
    if(idx !== -1){ end = start + idx; break; }
  }
  return block.slice(start, end).trim();
}

function sliceByAnchors(text, anchors){
  const segs = [];
  for(let i=0; i<anchors.length; i++){
    const start = anchors[i].index;
    const end = i+1 < anchors.length ? anchors[i+1].index : text.length;
    segs.push(text.slice(start, end).replace(/\s+/g,' ').trim());
  }
  return segs;
}

function splitMealRow(rowText, dayCount){
  let anchors = [...rowText.matchAll(/Tea,?\s*Coffee,?\s*Milk/gi)];
  if(anchors.length === dayCount) return sliceByAnchors(rowText, anchors);
  anchors = [...rowText.matchAll(/(Roti,\s*Rice|Rice,\s*Veg)/gi)];
  if(anchors.length === dayCount) return sliceByAnchors(rowText, anchors);
  anchors = [...rowText.matchAll(/\bRice,/gi)];
  if(anchors.length === dayCount) return sliceByAnchors(rowText, anchors);
  return null; // couldn't confidently split — caller falls back
}

function parseWeekBlock(block){
  const breakfastRow = extractMealRow(block, 'Breakfast', ['Lunch']);
  const lunchRow = extractMealRow(block, 'Lunch', ['Evening']);
  const eveningRow = extractMealRow(block, 'Evening', ['Dinner']);
  const dinnerRow = extractMealRow(block, 'Dinner', ['Menu items are subject', 'IIT TIRUPATI MESS MENU', 'Week\\s*2']);

  const bfSegs = splitMealRow(breakfastRow, 7);
  const lnSegs = splitMealRow(lunchRow, 7);
  const evSegs = splitMealRow(eveningRow, 7) || Array(7).fill('Tea, Coffee, Milk');
  const dnSegs = splitMealRow(dinnerRow, 7);

  const weekObj = {};
  DAYS_MON_FIRST.forEach((d,i)=>{
    weekObj[d] = {
      breakfast: bfSegs ? bfSegs[i] : '',
      lunch: lnSegs ? lnSegs[i] : '',
      tea: evSegs[i] || 'Tea, Coffee, Milk',
      dinner: dnSegs ? dnSegs[i] : '',
    };
  });
  // If a row couldn't be confidently split into 7 days, don't lose the
  // text — drop the whole row into Monday's cell with a flag so the
  // admin can see it and manually redistribute it across the week.
  if(!bfSegs) weekObj.Monday.breakfast = '[Could not auto-split — redistribute manually]\n' + breakfastRow.replace(/\s+/g,' ').trim();
  if(!lnSegs) weekObj.Monday.lunch = '[Could not auto-split — redistribute manually]\n' + lunchRow.replace(/\s+/g,' ').trim();
  if(!dnSegs) weekObj.Monday.dinner = '[Could not auto-split — redistribute manually]\n' + dinnerRow.replace(/\s+/g,' ').trim();

  const confident = !!bfSegs && !!lnSegs && !!dnSegs;
  return { weekObj, confident };
}

function parseMessPdfText(fullText){
  const splitIdx = fullText.search(/Week\s*2/i);
  const week1Block = splitIdx === -1 ? fullText : fullText.slice(0, splitIdx);
  const week2Block = splitIdx === -1 ? '' : fullText.slice(splitIdx);

  const w1 = parseWeekBlock(week1Block);
  const w2 = week2Block ? parseWeekBlock(week2Block) : null;
  return {
    week1: w1.weekObj, week1Confident: w1.confident,
    week2: w2 ? w2.weekObj : null, week2Confident: w2 ? w2.confident : null,
  };
}

/* ---------------------------------------------------------

--------------------------------------------------------- */
async function loadKey(key, fallback){
  if(!db) return fallback;
  try{
    const doc = await db.collection(COLLECTION).doc(key).get();
    if(doc.exists && doc.data() && doc.data().value) return JSON.parse(doc.data().value);
    return fallback;
  }catch(e){
    console.error('Load error', key, e);
    return fallback;
  }
}
async function saveKey(key, value){
  if(!db) return false;
  try{
    await db.collection(COLLECTION).doc(key).set({ value: JSON.stringify(value), updatedAt: Date.now() });
    return true;
  }catch(e){
    console.error('Storage error', key, e);
    return false;
  }
}
async function loadAll(){
  const [mess, messActiveWeek, transport, events, notices, contacts] = await Promise.all([
    loadKey('mess-menu', DEFAULTS.mess),
    loadKey('mess-active-week', DEFAULTS.messActiveWeek),
    loadKey('transport-schedule', DEFAULTS.transport),
    loadKey('events-calendar', DEFAULTS.events),

    loadKey('contacts-list', DEFAULTS.contacts),
  ]);

}

/* ---------------------------------------------------------
   TIME HELPERS
--------------------------------------------------------- */
function now(){ return new Date(); }
function todayName(){ return DAYS[now().getDay()]; }
function pad(n){ return n.toString().padStart(2,'0'); }
function fmtTime(h,m){
  const ampm = h >= 12 ? 'PM' : 'AM';
  let hh = h % 12; if(hh === 0) hh = 12;
  return `${hh}:${pad(m)} ${ampm}`;
}
function minutesNow(){ const d = now(); return d.getHours()*60 + d.getMinutes(); }
function toMinutes([h,m]){ return h*60+m; }

function currentMeal(){
  const mn = minutesNow();
  return MEAL_WINDOWS.find(w => mn >= toMinutes(w.start) && mn <= toMinutes(w.end)) || null;
}
function nextMeal(){
  const mn = minutesNow();
  const upcoming = MEAL_WINDOWS.filter(w => toMinutes(w.start) > mn).sort((a,b)=>toMinutes(a.start)-toMinutes(b.start));
  return upcoming[0] || MEAL_WINDOWS[0];
}
function parseTimeStr(t){
  // "HH:MM" 24hr -> minutes
  const [h,m] = t.split(':').map(Number);
  return h*60 + (m||0);
}
function allStopEntries(group){
  const labels = STOP_LABELS_BY_GROUP[group];
  const entries = [];
  (state.transport[group] || []).forEach((trip, ti) => {
    (trip.stops||[]).forEach((time, si) => {
      if(time) entries.push({ label: labels[si], time, type: trip.type || 'Student Bus', tripIndex: ti, stopIndex: si });
    });
  });
  return entries.sort((a,b)=>parseTimeStr(a.time)-parseTimeStr(b.time));
}
function nextTransport(){
  const group = todayScheduleGroup();
  const mn = minutesNow();
  const list = allStopEntries(group);
  if(!list.length) return null;
  const entry = list.find(t => parseTimeStr(t.time) >= mn) || list[0];
  return { ...entry, group };
}
function todayEvents(){
  const todayStr = now().toISOString().slice(0,10);
  return (state.events||[]).filter(e => e.date === todayStr).sort((a,b)=> (a.time||'').localeCompare(b.time||''));
}
function upcomingEvents(){
  const todayStr = now().toISOString().slice(0,10);
  return (state.events||[]).slice().sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time))
    .filter(e => e.date >= todayStr);
}
function latestNotice(){
  const list = (state.notices||[]).slice().sort((a,b)=> b.date.localeCompare(a.date));
  return list[0] || null;
}
function fmtDateHuman(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}

  if(adminSection==='events') return renderAdminEvents();
  if(adminSection==='notices') return renderAdminNotices();
  if(adminSection==='contacts') return renderAdminContacts();
}

/* ---------------------------------------------------------
   EVENT WIRING (delegated, re-attached on each render)
--------------------------------------------------------- */
function attachTabHandlers(){
  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', ()=>{ activeTab = el.dataset.goto; renderAll(); });
  });

  // Mess day pills (view)
  document.querySelectorAll('[data-day]').forEach(el=>{
    el.addEventListener('click', ()=>{ selectedDay = el.dataset.day; document.getElementById('content').innerHTML = renderMess(); attachTabHandlers(); });
  });
  // Mess week toggle (view — just browsing, doesn't change what's "active")
  document.querySelectorAll('[data-week]').forEach(el=>{
    el.addEventListener('click', ()=>{ selectedViewWeek = el.dataset.week; document.getElementById('content').innerHTML = renderMess(); attachTabHandlers(); });
  });

  // Admin login
  const loginBtn = document.getElementById('adminLoginBtn');
  if(loginBtn){
    loginBtn.addEventListener('click', async ()=>{
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPass').value;
      const errEl = document.getElementById('adminErr');
      errEl.textContent = '';
      loginBtn.disabled = true; loginBtn.textContent = 'Signing in…';
      try{
        await auth.signInWithEmailAndPassword(email, pass);
        // onAuthStateChanged will flip isAdmin and re-render
      }catch(e){
        errEl.textContent = 'Could not sign in — check your email and password.';
        loginBtn.disabled = false; loginBtn.textContent = 'Sign in';
      }
    });
    document.getElementById('adminPass').addEventListener('keydown', (e)=>{ if(e.key==='Enter') loginBtn.click(); });
  }

  const logoutBtn = document.getElementById('adminLogout');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>{ auth.signOut(); });

  // Admin section switch
  document.querySelectorAll('[data-admin]').forEach(el=>{
    el.addEventListener('click', ()=>{ adminSection = el.dataset.admin; document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers(); });
  });

  // Admin mess day pills
  document.querySelectorAll('[data-adminday]').forEach(el=>{
    el.addEventListener('click', ()=>{ selectedDay = el.dataset.adminday; document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers(); });
  });

  // Admin mess week selector (which week you're editing)
  document.querySelectorAll('[data-adminweek]').forEach(el=>{
    el.addEventListener('click', ()=>{ adminWeek = el.dataset.adminweek; document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers(); });
  });

  // Admin: set which week is currently active (shown to students)
  document.querySelectorAll('[data-activeweek]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.messActiveWeek = el.dataset.activeweek;
      document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers();
      const ok = await saveKey('mess-active-week', state.messActiveWeek);
      showToast(ok ? `${WEEK_LABELS[state.messActiveWeek]} set as this week's menu` : 'Save failed, try again');
    });
  });

  const saveMessBtn = document.getElementById('saveMess');
  if(saveMessBtn) saveMessBtn.addEventListener('click', async ()=>{
    const textareas = document.querySelectorAll('[data-meal]');
    const dayMenu = { ...((state.mess[adminWeek]||{})[selectedDay]||{}) };
    textareas.forEach(t => dayMenu[t.dataset.meal] = t.value);
    state.mess[adminWeek] = { ...(state.mess[adminWeek]||{}), [selectedDay]: dayMenu };
    const ok = await saveKey('mess-menu', state.mess);
    showToast(ok ? `${WEEK_LABELS[adminWeek]} · ${selectedDay} saved` : 'Save failed, try again');
  });

  const saveAllMessBtn = document.getElementById('saveAllMess');
  if(saveAllMessBtn) saveAllMessBtn.addEventListener('click', async ()=>{
    const ok = await saveKey('mess-menu', state.mess);
    showToast(ok ? 'Entire mess menu saved' : 'Save failed, try again');
  });

  const pdfInput = document.getElementById('messPdfInput');
  if(pdfInput) pdfInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById('pdfStatus');
    statusEl.textContent = 'Reading PDF…';
    try{
      if(typeof pdfjsLib === 'undefined') throw new Error('pdf.js not loaded');
      const text = await extractPdfText(file);
      const parsed = parseMessPdfText(text);
      state.mess.week1 = parsed.week1;
      if(parsed.week2) state.mess.week2 = parsed.week2;
      adminWeek = 'week1';
      selectedDay = 'Monday';
      const bothConfident = parsed.week1Confident && (parsed.week2 === null || parsed.week2Confident);
      statusEl.textContent = bothConfident
        ? 'Parsed successfully — please double-check each day below, then Save.'
        : 'Parsed with some uncertainty in at least one meal row — please carefully review every day below before saving.';
      document.getElementById('adminContent').innerHTML = renderAdminSection();
      attachTabHandlers();
      showToast('PDF read — review before saving');
    }catch(err){
      console.error('PDF parse error', err);
      statusEl.textContent = 'Could not read this PDF automatically. Please enter the menu manually below, or try a different file.';
    }
  });

  // Transport
  document.querySelectorAll('[data-tstop]').forEach(el=>{
    el.addEventListener('input', ()=>{ state.transport[+el.dataset.i].stops[+el.dataset.tstop] = el.value; });
  });
  const addTransportBtn = document.getElementById('addTransport');
  if(addTransportBtn) addTransportBtn.addEventListener('click', ()=>{
    state.transport.push(blankTrip());
    document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers();
  });
  document.querySelectorAll('[data-remove-transport]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.transport.splice(+el.dataset.removeTransport,1); document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers(); });
  });
  const saveTransportBtn = document.getElementById('saveTransport');
  if(saveTransportBtn) saveTransportBtn.addEventListener('click', async ()=>{
    const ok = await saveKey('transport-schedule', state.transport);
    showToast(ok ? 'Transport schedule saved' : 'Save failed, try again');
  });

  // Events
  document.querySelectorAll('[data-e]').forEach(el=>{
    el.addEventListener('input', ()=>{ state.events[+el.dataset.i][el.dataset.e] = el.value; });
  });
  const addEventBtn = document.getElementById('addEvent');
  if(addEventBtn) addEventBtn.addEventListener('click', ()=>{
    state.events.push({ title:'', date: now().toISOString().slice(0,10), time:'', venue:'' });
    document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers();
  });
  document.querySelectorAll('[data-remove-event]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.events.splice(+el.dataset.removeEvent,1); document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers(); });
  });
  const saveEventsBtn = document.getElementById('saveEvents');
  if(saveEventsBtn) saveEventsBtn.addEventListener('click', async ()=>{
    const ok = await saveKey('events-calendar', state.events);
    showToast(ok ? 'Events saved' : 'Save failed, try again');
  });

  // Notices
  document.querySelectorAll('[data-n]').forEach(el=>{
    el.addEventListener('input', ()=>{ state.notices[+el.dataset.i][el.dataset.n] = el.value; });
  });
  const addNoticeBtn = document.getElementById('addNotice');
  if(addNoticeBtn) addNoticeBtn.addEventListener('click', ()=>{
    state.notices.push({ title:'', date: now().toISOString().slice(0,10), body:'' });
    document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers();
  });
  document.querySelectorAll('[data-remove-notice]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.notices.splice(+el.dataset.removeNotice,1); document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers(); });
  });
  const saveNoticesBtn = document.getElementById('saveNotices');
  if(saveNoticesBtn) saveNoticesBtn.addEventListener('click', async ()=>{
    const ok = await saveKey('notices-board', state.notices);
    showToast(ok ? 'Notices saved' : 'Save failed, try again');
  });

  // Contacts
  document.querySelectorAll('[data-c]').forEach(el=>{
    el.addEventListener('input', ()=>{ state.contacts[+el.dataset.i][el.dataset.c] = el.value; });
  });
  const addContactBtn = document.getElementById('addContact');
  if(addContactBtn) addContactBtn.addEventListener('click', ()=>{
    state.contacts.push({ name:'', role:'', phone:'' });
    document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers();
  });
  document.querySelectorAll('[data-remove-contact]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.contacts.splice(+el.dataset.removeContact,1); document.getElementById('adminContent').innerHTML = renderAdminSection(); attachTabHandlers(); });
  });
  const saveContactsBtn = document.getElementById('saveContacts');
  if(saveContactsBtn) saveContactsBtn.addEventListener('click', async ()=>{
    const ok = await saveKey('contacts-list', state.contacts);
    showToast(ok ? 'Contacts saved' : 'Save failed, try again');
  });
}

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
async function init(){
  updateClock();
  setInterval(updateClock, 1000 * 15);
  await loadAll();
  renderAll();
  if(!firebaseAvailable) renderBlockedBanner();
}
function renderBlockedBanner(){
  const app = document.getElementById('app');
  const banner = document.createElement('div');
  banner.style.cssText = 'background:rgba(225,91,91,0.12);border:1px solid rgba(225,91,91,0.4);color:#f2b8b8;border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.5;margin:0 0 6px;';
  banner.innerHTML = `<strong>Some content may not load.</strong> Your browser (often an ad blocker or privacy extension) is blocking a resource this site needs for live updates and admin sign-in. You're seeing placeholder/default information. Try disabling ad-blocking for this site, or use a different browser, and refresh.`;
  app.insertBefore(banner, app.firstChild);
}
init();
</script>
